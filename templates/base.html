<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Flask Minimal" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">FlaskMinimal</a>
        <div class="navbar-nav ms-auto d-flex align-items-center gap-2">
          <a class="nav-link" href="{{ url_for('index') }}">Home</a>
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
          <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
          <a class="nav-link" href="{{ url_for('products.index') }}">Products</a>

          {% if session.get('group') == 'admin' %}
            <div class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Settings
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{{ url_for('settings.users') }}">User Management</a></li>
                <li><a class="dropdown-item" href="{{ url_for('settings.groups') }}">Group Management</a></li>
              </ul>
            </div>
          {% endif %}

          {% if session.get('username') %}
            <div class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                {{ session.get('username') }}
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}">Logout</a></li>
              </ul>
            </div>
          {% else %}
            <a class="nav-link btn btn-outline-light btn-sm" href="{{ url_for('auth.login') }}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
