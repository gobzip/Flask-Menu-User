{% extends "base.html" %}
{% block content %}
<h2>Edit Group</h2>

{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

{% if success %}
  <div class="alert alert-success">{{ success }}</div>
{% endif %}

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-8">
        <label for="group_name" class="form-label">Nama Group</label>
        <input type="text" class="form-control" id="group_name" name="group_name" value="{{ group.group_name }}" required>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Update Group</button>
      </div>
    </form>
    <div class="mt-3">
      <a href="{{ url_for('settings.groups') }}" class="btn btn-secondary">Kembali</a>
    </div>
  </div>
</div>
{% endblock %}
