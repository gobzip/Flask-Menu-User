{% extends "base.html" %}
{% block content %}
<h2>Edit User</h2>

{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

{% if success %}
  <div class="alert alert-success">{{ success }}</div>
{% endif %}

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-4">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
      </div>
      <div class="col-md-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Kosongkan jika tidak ingin mengganti">
      </div>
      <div class="col-md-4">
        <label class="form-label">Group</label>
        <div class="d-flex flex-wrap gap-2 mt-2">
          {% for group in groups %}
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="group_{{ loop.index }}" name="group_names" value="{{ group.group_name }}" {% if group.group_name in existing_groups %}checked{% endif %}>
            <label class="form-check-label" for="group_{{ loop.index }}">{{ group.group_name }}</label>
          </div>
          {% endfor %}
        </div>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Update User</button>
        <a href="{{ url_for('settings.users') }}" class="btn btn-secondary">Kembali</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
